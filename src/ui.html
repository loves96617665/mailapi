<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__DOMAIN__ Mail</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#1c1d21;--mute:#6b7280;--line:#e5e7eb;--acc:#f38020;--acc2:#fff3e8;--sel:#fff7ef;--danger:#dc2626;--ok:#16a34a}
[data-theme=dark]{--bg:#111214;--card:#1b1c1f;--fg:#e8e8ea;--mute:#9aa0aa;--line:#2b2d31;--acc:#f6923a;--acc2:#3a2a1c;--sel:#262019;--danger:#f87171;--ok:#4ade80}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang HK","Noto Sans TC",sans-serif;background:var(--bg);color:var(--fg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 12px}
button:hover{border-color:var(--acc)}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button.ghost{border:none;background:none;padding:4px 8px;color:var(--mute)}
button.ghost:hover{color:var(--fg)}
button.danger{color:var(--danger)}
button.sm{padding:3px 8px;font-size:12px}
input,select,textarea{width:100%;padding:8px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
textarea{min-height:160px;resize:vertical}
.hidden{display:none!important}
#auth{min-height:100%;display:flex;align-items:center;justify-content:center;padding:20px}
.authbox{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px}
.authbox h1{margin:0 0 4px;font-size:22px}.authbox p{margin:0 0 20px;color:var(--mute)}
.tabs{display:flex;gap:4px;margin-bottom:16px;background:var(--bg);padding:4px;border-radius:10px;flex-wrap:wrap}
.tabs button{flex:1;border:none;background:none;white-space:nowrap}.tabs button.on{background:var(--card);box-shadow:0 1px 2px #0002}
.field{margin-bottom:12px}.field label,.lbl{display:block;font-size:12px;color:var(--mute);margin-bottom:4px}
.suffix{display:flex;align-items:center;gap:6px}.suffix select{width:auto;max-width:55%}
.err{color:var(--danger);font-size:13px;min-height:20px}
#app{height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:6px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--card);flex-wrap:wrap}
header .logo{font-weight:700}header .sp{flex:1}header .user{color:var(--mute)}
main{flex:1;display:grid;grid-template-columns:270px 380px 1fr;min-height:0}
.col{border-right:1px solid var(--line);overflow:auto;min-height:0;background:var(--card)}
.col:last-child{border-right:none;background:var(--bg)}
.colhead{position:sticky;top:0;background:inherit;display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);font-weight:600;z-index:1}
.colhead .sp{flex:1}
.mb{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.mb:hover{background:var(--sel)}.mb.on{background:var(--acc2)}
.mb .addr{font-weight:500;word-break:break-all}.mb .meta{display:flex;align-items:center;gap:4px;color:var(--mute);font-size:12px}
.mb .meta .sp{flex:1}
.badge{background:var(--acc);color:#fff;border-radius:9px;padding:0 6px;font-size:11px;font-weight:600}
.newmb{padding:12px 14px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:6px}
.newmb .opts{grid-column:1/-1;display:flex;gap:6px}.newmb select{font-size:12px;padding:5px 8px}
.tools{padding:8px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px;background:var(--card);position:sticky;top:49px;z-index:1}
.chips{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);border-radius:14px;padding:2px 10px;font-size:12px;background:none}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.msg{padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer;position:relative}
.msg:hover{background:var(--sel)}.msg.on{background:var(--acc2)}
.msg.unread .from{font-weight:700}.msg.unread::before{content:"";position:absolute;left:4px;top:18px;width:6px;height:6px;border-radius:50%;background:var(--acc)}
.msg .row{display:flex;gap:6px;align-items:center}.msg .from{flex:1;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msg .time{color:var(--mute);font-size:12px;white-space:nowrap}
.msg .subj{color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.star{border:none;background:none;padding:0 2px;font-size:15px;color:var(--mute);line-height:1}.star.on{color:#f59e0b}
.lab{font-size:11px;border-radius:4px;padding:0 6px;background:var(--acc2);color:var(--acc);margin-right:4px}
.code{display:inline-flex;align-items:center;gap:6px;font:600 15px ui-monospace,Menlo,monospace;letter-spacing:2px;background:var(--acc);color:#fff;border-radius:6px;padding:2px 8px;border:none;margin-top:6px}
.code.big{font-size:28px;padding:8px 16px;letter-spacing:6px}
.empty{padding:40px 20px;text-align:center;color:var(--mute)}
.view{padding:20px;max-width:900px}
.view h2{margin:0 0 8px;font-size:20px;word-break:break-word}
.view .hdr{color:var(--mute);font-size:13px;margin-bottom:14px}
.view .bar{display:flex;gap:8px;align-items:center;margin:12px 0;flex-wrap:wrap}
.atts{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.att{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer;max-width:100%}
.att small{color:var(--mute)}.att img{max-height:60px;border-radius:4px}
.body{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.body iframe{width:100%;border:0;min-height:480px;background:#fff}
.body pre{margin:0;padding:16px;white-space:pre-wrap;word-break:break-word;font:13px/1.6 ui-monospace,Menlo,monospace}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:#9ca3af}.live.on{background:#22c55e;animation:p 2s infinite}
@keyframes p{50%{opacity:.3}}
.modal{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
.modal .box{background:var(--card);border-radius:14px;padding:22px;width:100%;max-width:600px;max-height:92vh;overflow:auto}
.modal h3{margin:0}.modal section{margin-bottom:18px}
.modal .box.wide{max-width:1000px}
.keybox{display:flex;gap:6px}.keybox input{font-family:ui-monospace,Menlo,monospace;font-size:12px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:8px;z-index:20;max-width:90vw}
.back{display:none}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--bg);border-radius:10px;padding:12px}.stat b{display:block;font-size:22px}.stat span{color:var(--mute);font-size:12px}
.row2{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.row2 input,.row2 select{width:auto;flex:1;min-width:120px}
table.ut{width:100%;border-collapse:collapse;font-size:13px}
table.ut th,table.ut td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
table.ut td.wrap{white-space:normal;word-break:break-all}
table.ut th{color:var(--mute);font-weight:500}
table.ut td.acts button{padding:3px 8px;font-size:12px;margin-right:4px}
.tag{font-size:11px;border-radius:4px;padding:1px 6px;background:var(--acc2);color:var(--acc);margin-left:3px}
.tag.off{background:#fee2e2;color:#b91c1c}.tag.ok{background:#dcfce7;color:#15803d}
.tblwrap{overflow:auto;max-height:55vh}
.chart{width:100%;height:180px;background:var(--bg);border-radius:10px;padding:8px}
.chart rect.r{fill:var(--acc)}.chart rect.g{fill:#60a5fa}.chart text{fill:var(--mute);font-size:9px}
.legend{font-size:12px;color:var(--mute);display:flex;gap:12px;margin:6px 0 14px}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.hint{font-size:12px;color:var(--mute);margin:4px 0 0}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px;word-break:break-all}
@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:960px){
  main{grid-template-columns:1fr}
  main .col{display:none;border-right:none}
  main[data-pane=mb] .c1,main[data-pane=list] .c2,main[data-pane=view] .c3{display:block}
  .back{display:inline-block}
}
</style>
</head>
<body>

<div id="auth" class="hidden">
  <div class="authbox">
    <h1>📬 __DOMAIN__</h1>
    <p data-t="tagline"></p>
    <div class="tabs"><button id="tLogin" class="on" data-t="login"></button><button id="tReg" data-t="register"></button></div>
    <form id="authForm">
      <div class="field"><label data-t="username"></label>
        <div class="suffix"><input id="fUser" autocomplete="username" required><select id="fDomain" class="hidden"></select></div></div>
      <div class="field"><label data-t="password"></label><input id="fPass" type="password" autocomplete="current-password" required></div>
      <div class="field hidden" id="fOtpWrap"><label data-t="otp"></label><input id="fOtp" inputmode="numeric" autocomplete="one-time-code" maxlength="6"></div>
      <div class="field hidden" id="fInviteWrap"><label data-t="invite"></label><input id="fInvite"></div>
      <div class="err" id="authErr"></div>
      <button class="pri" style="width:100%" id="authBtn" data-t="login"></button>
    </form>
    <div style="display:flex;justify-content:space-between;margin-top:16px">
      <a href="/docs" style="color:var(--mute);font-size:13px" data-t="apidocs"></a>
      <span><button class="ghost" onclick="toggleLang()">中 / EN</button><button class="ghost" onclick="toggleTheme()">◐</button></span>
    </div>
  </div>
</div>

<div id="app" class="hidden">
  <header>
    <span class="logo">📬 __DOMAIN__</span><span class="live" id="liveDot" title="realtime"></span>
    <span class="sp"></span>
    <span class="user" id="hUser"></span>
    <button class="ghost hidden" id="composeBtn" onclick="openCompose()" data-t="compose"></button>
    <button class="ghost" onclick="toggleLang()">中 / EN</button>
    <button class="ghost" onclick="toggleTheme()">◐</button>
    <button class="ghost hidden" id="adminBtn" onclick="openAdmin()" data-t="admin"></button>
    <button class="ghost" onclick="openSettings()" data-t="settings"></button>
    <button class="ghost" onclick="logout()" data-t="logout"></button>
  </header>
  <main id="main" data-pane="mb">
    <div class="col c1">
      <div class="colhead"><span data-t="mailboxes"></span><span class="sp"></span><span id="mbCount" style="color:var(--mute);font-weight:400"></span></div>
      <form class="newmb" id="newMbForm"><input id="newMbName" data-tp="newmb_ph"><button class="pri" data-t="add"></button>
        <div class="opts"><select id="newMbDomain"></select><select id="newMbTtl"><option value="" data-t="ttl_none"></option><option value="1">1h</option><option value="24">24h</option><option value="72">3d</option><option value="168">7d</option><option value="720">30d</option></select></div></form>
      <div id="mbList"></div>
    </div>
    <div class="col c2">
      <div class="colhead"><button class="ghost back" onclick="pane('mb')">‹</button><span id="curAddr" style="word-break:break-all;flex:1"></span>
        <button class="ghost" onclick="readAll()" data-t="readall" style="font-weight:400"></button>
        <button class="ghost" onclick="loadMessages(true)" title="refresh">↻</button></div>
      <div class="tools">
        <input id="q" data-tp="search_mail" oninput="clearTimeout(window._q);window._q=setTimeout(()=>loadMessages(true),350)">
        <div class="chips" id="chips"></div>
      </div>
      <div id="msgList"></div>
      <div id="moreWrap" class="hidden" style="padding:12px;text-align:center"><button onclick="loadMore()" data-t="more"></button></div>
    </div>
    <div class="col c3"><div id="msgView"><div class="empty" data-t="pick"></div></div></div>
  </main>
</div>

<!-- settings -->
<div id="settings" class="modal hidden" onclick="if(event.target===this)closeM('settings')">
  <div class="box">
    <div class="row2"><h3 style="flex:1" data-t="settings"></h3><button onclick="closeM('settings')" data-t="close"></button></div>
    <div class="tabs" id="sTabs"></div>
    <div data-sp="acct">
      <section><span class="lbl">API Key</span>
        <div class="keybox"><input id="sKey" readonly type="password"><button onclick="sKey.type=sKey.type==='password'?'text':'password'">👁</button><button onclick="copy(sKey.value)" data-t="copy"></button></div>
        <div style="margin-top:8px;display:flex;gap:8px"><button class="danger" onclick="rotateKey()" data-t="rotate"></button><a href="/docs" target="_blank" style="align-self:center;color:var(--acc)" data-t="apidocs"></a></div>
      </section>
      <section><span class="lbl" data-t="newpass"></span>
        <div class="keybox"><input id="sPass" type="password" autocomplete="new-password"><button onclick="changePass()" data-t="save"></button></div></section>
    </div>
    <div data-sp="notify" class="hidden">
      <section><span class="lbl">Webhook URL</span>
        <div class="keybox"><input id="sHook" placeholder="https://example.com/hook"><button onclick="saveNotify({webhook_url:sHook.value})" data-t="save"></button><button onclick="testHook()" data-t="test"></button></div>
        <div id="sHookSecWrap" class="hidden" style="margin-top:8px"><span class="lbl" data-t="hooksecret"></span>
          <div class="keybox"><input id="sHookSec" readonly class="mono"><button onclick="copy(sHookSec.value)" data-t="copy"></button><button class="danger" onclick="rotateHook()" data-t="regen"></button></div></div>
        <p class="hint" data-t="hookhint"></p>
      </section>
      <section><span class="lbl">Telegram Bot Token</span>
        <input id="sTgTok" placeholder="123456789:AA..." style="margin-bottom:6px">
        <span class="lbl">Chat ID</span>
        <div class="keybox"><input id="sTgChat" placeholder="123456789"><button onclick="saveTg()" data-t="save"></button><button onclick="testTg()" data-t="test"></button></div>
        <p class="hint" data-t="tghint"></p>
      </section>
    </div>
    <div data-sp="rules" class="hidden">
      <section>
        <div class="row2"><select id="rKind"><option value="forward" data-t="r_forward"></option><option value="block" data-t="r_block"></option><option value="allow" data-t="r_allow"></option></select>
          <select id="rField"><option value="any" data-t="f_any"></option><option value="from" data-t="from"></option><option value="subject" data-t="f_subject"></option></select>
          <select id="rAddr"></select></div>
        <div class="row2"><input id="rPattern" data-tp="r_pattern"><input id="rTarget" data-tp="r_target"><button class="pri" onclick="addRule()" data-t="add"></button></div>
        <p class="hint" data-t="rulehint"></p>
      </section>
      <div class="tblwrap"><table class="ut"><thead><tr><th data-t="r_type"></th><th data-t="r_cond"></th><th data-t="r_scope"></th><th></th></tr></thead><tbody id="rList"></tbody></table></div>
    </div>
    <div data-sp="2fa" class="hidden">
      <section id="tfOff">
        <p data-t="tf_desc"></p>
        <button class="pri" onclick="tfSetup()" data-t="tf_setup"></button>
        <div id="tfSetupBox" class="hidden" style="margin-top:12px">
          <span class="lbl" data-t="tf_secret"></span><div class="keybox"><input id="tfSecret" readonly class="mono"><button onclick="copy(tfSecret.value)" data-t="copy"></button></div>
          <span class="lbl" style="margin-top:8px">otpauth URI</span><div class="keybox"><input id="tfUri" readonly class="mono"><button onclick="copy(tfUri.value)" data-t="copy"></button></div>
          <span class="lbl" style="margin-top:8px" data-t="tf_enter"></span><div class="keybox"><input id="tfCode" inputmode="numeric" maxlength="6"><button class="pri" onclick="tfEnable()" data-t="tf_enable"></button></div>
        </div>
      </section>
      <section id="tfOn" class="hidden">
        <p><span class="tag ok" data-t="tf_on"></span></p>
        <span class="lbl" data-t="tf_enter"></span><div class="keybox"><input id="tfOffCode" inputmode="numeric" maxlength="6"><button class="danger" onclick="tfDisable()" data-t="tf_disable"></button></div>
      </section>
    </div>
    <div data-sp="sent" class="hidden">
      <div class="tblwrap"><table class="ut"><thead><tr><th data-t="time"></th><th data-t="from"></th><th data-t="to"></th><th data-t="f_subject"></th><th></th></tr></thead><tbody id="sentList"></tbody></table></div>
    </div>
  </div>
</div>

<!-- compose -->
<div id="compose" class="modal hidden" onclick="if(event.target===this)closeM('compose')">
  <div class="box">
    <div class="row2"><h3 style="flex:1" data-t="compose"></h3><button onclick="closeM('compose')" data-t="close"></button></div>
    <div class="field"><label data-t="from"></label><select id="cFrom"></select></div>
    <div class="field"><label data-t="to"></label><input id="cTo" placeholder="a@example.com, b@example.com"></div>
    <div class="field"><label data-t="f_subject"></label><input id="cSubj"></div>
    <div class="field"><textarea id="cBody"></textarea></div>
    <div class="err" id="cErr"></div>
    <div style="text-align:right"><button class="pri" id="cSend" onclick="sendMail()" data-t="send"></button></div>
  </div>
</div>

<!-- admin -->
<div id="admin" class="modal hidden" onclick="if(event.target===this)closeM('admin')">
  <div class="box wide">
    <div class="row2"><h3 style="flex:1" data-t="admin"></h3><button onclick="closeM('admin')" data-t="close"></button></div>
    <div class="tabs" id="aTabs"></div>
    <div data-ap="over">
      <div class="stats" id="aStats"></div>
      <svg class="chart" id="aChart" viewBox="0 0 600 160" preserveAspectRatio="none"></svg>
      <div class="legend"><span><i style="background:var(--acc)"></i><span data-t="received30"></span></span><span><i style="background:#60a5fa"></i><span data-t="registered"></span></span><span id="aChartMax"></span></div>
      <span class="lbl" data-t="topusers"></span>
      <table class="ut"><tbody id="aTop"></tbody></table>
    </div>
    <div data-ap="users" class="hidden">
      <div class="row2">
        <label style="display:flex;gap:6px;align-items:center;cursor:pointer;flex:0"><input type="checkbox" id="aReg" style="width:auto" onchange="saveCfg({allow_register:this.checked})"><span data-t="openreg" style="white-space:nowrap"></span></label>
        <span style="flex:1"></span>
        <span data-t="invite"></span><input id="aInvite" style="max-width:160px" data-tp="invite_ph"><button onclick="saveCfg({invite_code:aInvite.value})" data-t="save"></button>
      </div>
      <div class="row2"><input id="aQ" data-tp="search" oninput="clearTimeout(window._aq);window._aq=setTimeout(loadUsers,300)"></div>
      <div class="tblwrap"><table class="ut"><thead><tr><th data-t="username"></th><th data-t="mailboxes"></th><th data-t="msgcount"></th><th data-t="lastmail"></th><th data-t="created"></th><th></th></tr></thead><tbody id="aUsers"></tbody></table></div>
    </div>
    <div data-ap="domains" class="hidden">
      <div class="row2"><input id="aDom" placeholder="example.com"><button class="pri" onclick="addDomain()" data-t="add"></button></div>
      <p class="hint" data-t="domhint"></p>
      <table class="ut"><thead><tr><th data-t="domain"></th><th data-t="mailboxes"></th><th data-t="status"></th><th></th></tr></thead><tbody id="aDoms"></tbody></table>
    </div>
    <div data-ap="send" class="hidden">
      <p id="aSendReady"></p>
      <div class="row2"><label style="display:flex;gap:6px;align-items:center;cursor:pointer;flex:0"><input type="checkbox" id="aSendOn" style="width:auto" onchange="saveCfg({allow_send:this.checked})"><span data-t="allowsend" style="white-space:nowrap"></span></label></div>
      <div class="row2"><span data-t="sendlimit"></span><input id="aSendLimit" type="number" min="0" max="1000" style="max-width:120px"><button onclick="saveCfg({send_limit:Number(aSendLimit.value)})" data-t="save"></button></div>
      <p class="hint" data-t="sendhint"></p>
    </div>
    <div data-ap="audit" class="hidden">
      <div class="row2"><input id="aAq" data-tp="search" oninput="clearTimeout(window._aa);window._aa=setTimeout(loadAudit,300)"></div>
      <div class="tblwrap"><table class="ut"><thead><tr><th data-t="time"></th><th data-t="actor"></th><th data-t="action"></th><th data-t="target"></th><th>IP</th></tr></thead><tbody id="aAudit"></tbody></table></div>
    </div>
  </div>
</div>

<script>

const state={key:localStorage.mk||"",user:"",mailboxes:[],cur:localStorage.cur||"",messages:[],open:null,view:"html",filter:"all",label:"",labels:[],domains:[],canSend:false};
async function api(path,opt={}){
  const r=await fetch(path,{...opt,headers:{"content-type":"application/json",...(state.key?{authorization:"Bearer "+state.key}:{}),...(opt.headers||{})}});
  const j=await r.json().catch(()=>({ok:false,error:"bad response"}));
  if(r.status===401&&state.key&&!path.includes("login")&&!j.need_otp){logout();throw new Error(j.error)}
  if(!r.ok||j.ok===false){const e=new Error(j.error||("HTTP "+r.status));e.data=j;throw e}
  return j;
}

let ws,wsRetry=0,wsTimer,pingTimer;
function setLive(on){$("liveDot").classList.toggle("on",on);$("liveDot").title=t(on?"live_on":"live_off")}
function openWs(){
  closeWs(true);
  try{ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host+"/api/ws?key="+encodeURIComponent(state.key))}catch{return}
  ws.onopen=()=>{wsRetry=0;setLive(true);pingTimer=setInterval(()=>{try{ws.send("ping")}catch{}},30000)};
  ws.onmessage=e=>{if(e.data==="pong")return;let d;try{d=JSON.parse(e.data)}catch{return}if(d.type==="message")onNewMail(d)};
  ws.onclose=()=>{setLive(false);clearInterval(pingTimer);if(!state.key)return;wsTimer=setTimeout(openWs,Math.min(30000,1000*2**wsRetry++))};
}
function closeWs(keep){clearTimeout(wsTimer);clearInterval(pingTimer);if(ws){ws.onclose=null;try{ws.close()}catch{}ws=null}if(!keep)setLive(false)}
function onNewMail(d){
  const mb=state.mailboxes.find(x=>x.address===d.address);if(mb){mb.count++;mb.unread++;renderMb()}
  document.title="✉ "+(d.code||d.subject||"")+" – "+DOMAIN;
  if(d.address===state.cur)loadMessages(true);
  if(document.hidden&&"Notification"in window&&Notification.permission==="granted")new Notification(d.code?("🔑 "+d.code):(d.subject||d.from),{body:d.from+"\n"+d.address});
  toast("📬 "+(d.code?d.code+" · ":"")+(d.subject||d.from));
}

let timer;
async function boot(){
  if(!state.key){$("auth").classList.remove("hidden");$("app").classList.add("hidden");loadPublic();return}
  let me;try{me=await api("/api/me");}catch{return}
  state.user=me.user;state.admin=me.is_admin;state.domains=me.domains;state.canSend=me.can_send;state.totp=me.totp_on;
  $("auth").classList.add("hidden");$("app").classList.remove("hidden");$("hUser").textContent=state.user;
  $("adminBtn").classList.toggle("hidden",!state.admin);$("composeBtn").classList.toggle("hidden",!state.canSend);
  $("newMbDomain").replaceChildren(...state.domains.map(d=>h("option",{value:d},"@"+d)));$("newMbDomain").classList.toggle("hidden",state.domains.length<2);
  renderChips();await loadMailboxes();loadLabels();
  clearInterval(timer);timer=setInterval(()=>{if(!document.hidden&&!(ws&&ws.readyState===1))loadMessages()},8000);
  openWs();
  if("Notification"in window&&Notification.permission==="default")document.addEventListener("click",()=>Notification.requestPermission(),{once:true});
}

    f.srcdoc='<base target="_blank"><meta name="referrer" content="no-referrer"><style>body{font-family:sans-serif;margin:16px;word-break:break-word}img{max-width:100%}</style>'+m.html;
    f.onload=()=>{try{f.style.height=Math.max(480,f.contentDocument.body.scrollHeight+40)+"px"}catch{}};
    body=f;
  }else body=h("pre",{},m.text||m.html?.replace(/<[^>]+>/g,"")||t("nobody"));
  const atts=(m.attachments||[]).map(a=>{const el=h("div",{class:"att",title:a.filename,onclick:()=>download(a)},"📎 ",h("span",{},a.filename||"file"),h("small",{},size(a.size||0)));
    if(/^image\/(png|jpe?g|gif|webp)$/.test(a.mime||""))attFetch(a,true).then(u=>el.prepend(h("img",{src:u}))).catch(()=>{});return el});
  V.replaceChildren(h("div",{class:"view"},
    h("button",{class:"ghost back",onclick:()=>pane("list")},"‹ "+state.cur),
    h("h2",{},m.subject||t("nobody")),
    h("div",{class:"hdr"},t("from")+": "+(m.from_addr||"?"),h("br"),t("to")+": "+m.address+" · "+new Date(m.received_at).toLocaleString()),
    m.labels?h("div",{},...m.labels.split(",").map(l=>h("span",{class:"lab"},l))):null,
    m.code?h("div",{style:"margin-top:8px"},h("div",{style:"font-size:12px;color:var(--mute)"},t("code")),h("button",{class:"code big",onclick:()=>copy(m.code)},m.code+" ⧉")):null,
    atts.length?h("div",{class:"atts"},...atts):null,
    h("div",{class:"bar"},
      m.html?h("button",{class:state.view==="html"?"pri":"",onclick:()=>{state.view="html";renderView()}},t("html")):null,
      h("button",{class:state.view==="text"?"pri":"",onclick:()=>{state.view="text";renderView()}},t("text")),
      h("span",{style:"flex:1"}),
      h("button",{onclick:()=>patchMsg(m.id,{starred:!m.starred})},(m.starred?"★ ":"☆ ")+t(m.starred?"unstar":"star")),
      h("button",{onclick:()=>{const v=prompt(t("editlabels"),m.labels||"");if(v!==null)patchMsg(m.id,{labels:v})}},"🏷 "+t("labels")),
      h("button",{onclick:()=>patchMsg(m.id,{is_read:false})},t("markunread")),
      h("button",{class:"danger",onclick:delMsg},t("del"))),
    h("div",{class:"body"},body)));
}

async function openAdmin(){$("admin").classList.remove("hidden");showATab(aTab)}
async function loadStats(){try{const j=await api("/api/admin/stats");
  $("aStats").replaceChildren(...[[j.users,t("users")],[j.mailboxes,t("mailboxes")],[j.messages,t("msgcount")],[j.messages_24h,t("mail24")],[j.active_7d,t("active7")],[j.attachments+" · "+size(j.att_bytes),t("attsz")]].map(([n,l])=>h("div",{class:"stat"},h("b",{},String(n)),h("span",{},l))));
  const s=j.settings;$("aReg").checked=s.allow_register;$("aInvite").value=s.invite_code||"";$("aSendOn").checked=s.allow_send;$("aSendLimit").value=s.send_limit;$("aSendReady").textContent=t(s.send_ready?"sendready":"sendnotready");return j}catch(x){toast(x.message)}}
async function loadOverview(){await loadStats();try{const j=await api("/api/admin/chart?days=30");
  const d=j.days,max=Math.max(1,...d.map(x=>Math.max(x.received,x.registered))),W=600,H=145,bw=W/d.length;const NS="http://www.w3.org/2000/svg";const svg=$("aChart");svg.replaceChildren();
  const el=(n,a)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);return e};
  d.forEach((x,i)=>{const rh=x.received/max*H,gh=x.registered/max*H;const r=el("rect",{class:"r",x:i*bw+1,y:H-rh,width:bw*0.6,height:rh});r.append(el("title",{}));r.firstChild.textContent=x.day+": "+x.received;svg.append(r);
    if(gh){const g=el("rect",{class:"g",x:i*bw+bw*0.6,y:H-gh,width:bw*0.3,height:gh});svg.append(g)}
    if(i%5===0||i===d.length-1){const tx=el("text",{x:i*bw,y:158});tx.textContent=x.day.slice(5);svg.append(tx)}});
  $("aChartMax").textContent="max "+max;
  $("aTop").replaceChildren(...j.top_users_7d.map(u=>h("tr",{},h("td",{},u.username),h("td",{},String(u.n)))))}catch(x){toast(x.message)}}

async function loadUsers(){try{const j=await api("/api/admin/users?q="+encodeURIComponent($("aQ").value.trim()));
  const B=$("aUsers");B.replaceChildren();
  for(const u of j.users){
    const act=(label,fn,cls="")=>h("button",{class:cls,onclick:fn},label);
    const locked=u.lock_until>Date.now();
    B.append(h("tr",{},
      h("td",{},u.username,u.is_admin?h("span",{class:"tag"},t("adm")):null,u.disabled?h("span",{class:"tag off"},t("disabled")):null,u.totp_on?h("span",{class:"tag ok"},"2FA"):null,u.can_send?h("span",{class:"tag ok"},t("cansend")):null,locked?h("span",{class:"tag off"},t("locked")):null),
      h("td",{},String(u.mailboxes)),h("td",{},String(u.messages)),
      h("td",{},u.last_mail?ago(u.last_mail):"—"),h("td",{},new Date(u.created_at).toLocaleDateString()),
      h("td",{class:"acts"},
        u.is_admin?null:act(u.disabled?t("enable"):t("disable"),()=>userAct(u.username,u.disabled?"enable":"disable")),
        act((u.can_send?"✓ ":"")+t("cansend"),()=>userAct(u.username,"send",{on:!u.can_send})),
        locked?act(t("unlock"),()=>userAct(u.username,"unlock")):null,
        u.totp_on?act(t("reset2fa"),async()=>{if(!confirm(t("reset2faq")+"\n"+u.username))return;try{await api("/api/admin/users/"+encodeURIComponent(u.username)+"/2fa",{method:"DELETE"});loadUsers()}catch(x){toast(x.message)}}):null,
        act(t("resetpw"),()=>resetPw(u.username)),
        u.is_admin?null:act(t("del"),()=>delUser(u.username),"danger"))));
  }}catch(x){toast(x.message)}}
